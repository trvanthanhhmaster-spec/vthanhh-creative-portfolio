<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Vthanhh 3D Scene</title>
  <style>
    html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    body{pointer-events:none}
    canvas{display:block;width:100%!important;height:100%!important;background:transparent}
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.8",
      "react-dom": "https://esm.sh/react-dom@19.2.8?external=react",
      "react-dom/client": "https://esm.sh/react-dom@19.2.8/client?external=react",
      "react/jsx-runtime": "https://esm.sh/react@19.2.8/jsx-runtime",
      "three": "https://esm.sh/three@0.187.0",
      "@react-three/fiber": "https://esm.sh/@react-three/fiber@9.8.2?external=react,react-dom,three"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React,{useMemo,useRef} from "react";
    import {createRoot} from "react-dom/client";
    import {Canvas,useFrame} from "@react-three/fiber";
    import * as THREE from "three";

    let pointerX=0,pointerY=0,scrollProgress=0;
    const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.addEventListener("message",(event)=>{
      if(event.origin!==window.location.origin||!event.data)return;
      if(event.data.type==="creative-pointer"){pointerX=Number(event.data.x)||0;pointerY=Number(event.data.y)||0;}
      if(event.data.type==="creative-scroll")scrollProgress=Math.min(Math.max(Number(event.data.progress)||0,0),1);
    });

    function Particles(){
      const positions=useMemo(()=>{
        const points=new Float32Array(560*3);
        for(let i=0;i<560;i++){
          const angle=i*2.3999632297;
          const radius=1.3+(i%23)/23*3.4;
          points[i*3]=Math.cos(angle)*radius;
          points[i*3+1]=Math.sin(angle*1.31)*radius*.56;
          points[i*3+2]=Math.sin(angle)*radius;
        }
        return points;
      },[]);
      return React.createElement("points",null,
        React.createElement("bufferGeometry",null,
          React.createElement("bufferAttribute",{attach:"attributes-position",args:[positions,3]})),
        React.createElement("pointsMaterial",{size:.014,color:"#bceef0",transparent:true,opacity:.52,sizeAttenuation:true}));
    }

    function Emblem(){
      const group=useRef(null),ring=useRef(null);
      const geometry=useMemo(()=>{
        const shape=new THREE.Shape();
        shape.moveTo(-.88,.78);shape.lineTo(-.5,.78);shape.lineTo(0,-.56);
        shape.lineTo(.5,.78);shape.lineTo(.88,.78);shape.lineTo(0,-1.08);shape.closePath();
        return new THREE.ExtrudeGeometry(shape,{depth:.18,bevelEnabled:true,bevelSegments:5,steps:1,bevelSize:.035,bevelThickness:.045});
      },[]);
      useFrame((_state,delta)=>{
        if(!group.current)return;
        const target = window.innerWidth < 720 ? 0.08 : 0.56;
        group.current.position.x+=(target+pointerX*.13-group.current.position.x)*.025;
        group.current.position.y+=(pointerY*.12-group.current.position.y)*.025;
        group.current.scale.setScalar(1-scrollProgress*.12);
        if(!reduced){
          group.current.rotation.y+=delta*.15;
          group.current.rotation.x+=(pointerY*.16-group.current.rotation.x)*.035;
          group.current.rotation.z+=(pointerX*.025-group.current.rotation.z)*.02;
          if(ring.current)ring.current.rotation.z+=delta*.12;
        }
      });
      return React.createElement("group",{ref:group,position:[.56,0,0]},
        React.createElement("mesh",{geometry,castShadow:true,receiveShadow:true},
          React.createElement("meshPhysicalMaterial",{color:"#91e7ed",metalness:.86,roughness:.16,clearcoat:1,clearcoatRoughness:.08,emissive:"#123e4b",emissiveIntensity:.28})),
        React.createElement("mesh",{ref:ring,rotation:[1.16,.25,.24]},
          React.createElement("torusGeometry",{args:[1.62,.018,16,220]}),
          React.createElement("meshStandardMaterial",{color:"#dfb979",metalness:.92,roughness:.24,emissive:"#6b4820",emissiveIntensity:.28})),
        React.createElement("mesh",{rotation:[.35,.72,1.12]},
          React.createElement("torusGeometry",{args:[1.94,.009,10,220]}),
          React.createElement("meshBasicMaterial",{color:"#8de3ec",transparent:true,opacity:.38})),
        React.createElement("mesh",{position:[0,0,.28]},
          React.createElement("icosahedronGeometry",{args:[.27,2]}),
          React.createElement("meshPhysicalMaterial",{color:"#153c4d",metalness:.92,roughness:.13,clearcoat:1,transmission:.16,thickness:.5})));
    }

    function Scene(){
      return React.createElement(Canvas,{camera:{position:[0,0,6.8],fov:42},dpr:[1,1.45],gl:{alpha:true,antialias:true,powerPreference:"high-performance"},onCreated:({gl})=>gl.setClearColor(0x000000,0)},
        React.createElement("ambientLight",{intensity:1.1}),
        React.createElement("pointLight",{position:[3,2,4],intensity:4.2,color:"#8de3ec"}),
        React.createElement("pointLight",{position:[-3,-1,3],intensity:3.2,color:"#dfb979"}),
        React.createElement("spotLight",{position:[0,5,4],angle:.55,penumbra:1,intensity:5,color:"#d8f9f8"}),
        React.createElement(Particles),React.createElement(Emblem));
    }
    const root=document.getElementById("root");
    if(root)createRoot(root).render(React.createElement(Scene));
  </script>
</body>
</html>
